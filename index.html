    <!-- Font Awesome 用 bootcdn -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 中文问候：霞鹜文楷；英文：Instrument Serif（标题/引言）+ Source Sans 3（正文/UI） -->

    <link
        rel="stylesheet"
        href="https://fonts.bunny.net/css?family=instrument-serif:400,500|source-sans-3:400,500,600&display=swap"
    />

</head>
<body class="min-h-screen antialiased">
    <svg class="header-flair-svg-defs" aria-hidden="true" focusable="false">
        <defs>
            <filter id="header-flair-distort-filter" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
                <feTurbulence
                    id="header-flair-turbulence"
                    type="fractalNoise"
                    baseFrequency="0.045 0.09"
                    numOctaves="2"
                    seed="8"
                    result="noise"
                />
                <feDisplacementMap
                    id="header-flair-displacement"
                    in="SourceGraphic"
                    in2="noise"
                    scale="28"
                    xChannelSelector="R"
                    yChannelSelector="G"
                />
            </filter>
        </defs>
    </svg>
    <!-- 初始布局 - 头像、名字和身份 -->
    <div id="initial-layout" class="initial-layout">
        <div class="avatar rounded-full initial-avatar overflow-hidden mb-6 border-4 border-white">
            <div class="avatar-photo-stack" data-avatar-stack="initial">
                <img class="avatar-photo-thumb w-full h-full object-cover" src="" alt="" decoding="async" width="200" height="200" />
                <img id="profile-avatar" class="avatar-photo-full w-full h-full object-cover" src="" alt="" decoding="async" />
            </div>
        </div>
        
        <h1 class="initial-name font-display text-gray-800">
            <span class="name-highlight i18n-hero-name"></span>
        </h1>
        <p id="tagline-initial" class="initial-title text-[#86868b] tracking-wide font-medium"></p>
    </div>
    
    <!-- 头像过渡元素 -->
    <div id="avatar-transition" class="avatar-transition hidden">
        <div class="avatar-photo-stack w-full h-full" data-avatar-stack="transition">
            <img class="avatar-photo-thumb w-full h-full object-cover" src="" alt="" decoding="async" />
            <img id="transition-avatar" class="avatar-photo-full w-full h-full object-cover" src="" alt="" decoding="async" />
        </div>
    </div>
    
    <!-- 主内容区域 -->
    <div id="main-content" class="page-shell layout-stack pt-8 pb-0 md:pt-12">
        <header class="header-hero flex flex-col items-center text-center">
            <div class="header-hero__cluster mb-4 md:mb-5">
                <div id="header-flair-left" class="header-flair header-flair--left" aria-live="polite"></div>
                <div class="header-avatar-slot relative w-40 h-40 shrink-0">
                <div id="header-avatar-wrap" class="avatar rounded-full w-full h-full overflow-hidden ring-1 ring-black/[0.06] bg-transparent">
                    <div class="avatar-photo-stack" data-avatar-stack="header">
                        <img class="avatar-photo-thumb w-full h-full object-cover" src="" alt="" decoding="async" />
                        <img id="final-avatar" class="avatar-photo-full w-full h-full object-cover" src="" alt="" decoding="async" />
                    </div>
                </div>
                <span id="avatar-presence-badge" class="avatar-presence-badge" hidden role="img"></span>
                </div>
                <div id="header-flair-right" class="header-flair header-flair--right" aria-live="polite"></div>
            </div>

            <h1 class="hero-title font-display mb-2 md:mb-3">
                <span class="hero-name-wrap">
                    <span class="name-highlight i18n-hero-name"></span>
                    <button
                        type="button"
                        id="hero-like-btn"
                        class="hero-like-btn"
                        hidden
                        aria-pressed="false"
                        aria-label=""
                    >
                        <svg class="hero-like-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path
                                d="M1 21h4V9H1v12zm20-10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"
                            />
                        </svg>
                        <span id="hero-like-count" class="hero-like-count" aria-hidden="true"></span>
                    </button>
                </span>
            </h1>
            <p id="tagline-main" class="max-w-[18rem] sm:max-w-md text-[1.0625rem] md:text-lg leading-relaxed text-[#6e6e73] font-normal tracking-[0.02em]"></p>
        </header>

        <nav id="social-icons" class="-mt-1 md:-mt-2" aria-label=""></nav>

        <section id="links-section" aria-label="">
            <div id="cards-container" class="content-links" role="navigation" aria-label=""></div>
        </section>

        <section id="quote-section" aria-label="">
            <div id="quote-container" class="quote-container cursor-pointer select-none" role="button" tabindex="0" aria-label="" title="">
                <p id="quote" class="font-quote"></p>
                <p id="quote-author" class="quote-attribution"></p>
            </div>
        </section>
    </div>

    <script type="module" src="./src/js/main.js"></script>
</body>
</html>
