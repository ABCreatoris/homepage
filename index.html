    <style>
        :root {
            --page-bg: #f2f2f6;
        }

        html[lang^='en'] {
            --en-serif-tracking: 0.034em;
            --en-serif-tracking-flair: 0.052em;
            --en-serif-line: 1.58;
            --en-serif-side: 1.15rem;
        }

        .social-icon {
            transition: opacity 0.3s ease, transform 0.35s ease;
            opacity: 0;
            transform: translateY(8px);
        }
        
        .social-icon.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .social-icon:hover {
            opacity: 0.65;
        }

        /* 社交图标：单行；字号用固定阶梯，不用多级 clamp */
        #social-icons {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            box-sizing: border-box;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #social-icons::-webkit-scrollbar {
            display: none;
        }

        #social-icons .social-icon {
            flex-shrink: 0;
            margin: 0;
            font-size: 1.5rem;
            line-height: 1;
        }

        @media (max-width: 640px) {
            #social-icons {
                gap: 0.45rem;
                padding-left: 0.35rem;
                padding-right: 0.35rem;
            }

            #social-icons .social-icon {
                font-size: 1.625rem;
            }

            /* 窄屏链接：居中、大留白、短分割线 — 偏「版式」而非工具列表 */
            .content-links {
                flex-direction: column;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: flex-start;
                max-width: min(23rem, 94vw);
                gap: 0;
                margin-top: 0.5rem;
                margin-left: auto;
                margin-right: auto;
                padding: 0.15rem 0.5rem 0.35rem;
                font-size: 1rem;
                line-height: 1.55;
                background: none;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }

            .content-links__sep {
                display: none;
            }

            .content-links__a {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0;
                width: 100%;
                max-width: 20rem;
                text-align: center;
                text-decoration: none;
                padding: 0.55rem 0.75rem 0.62rem;
                min-height: 0;
                border-radius: 0;
                background: transparent;
                border: none;
                font-weight: 500;
                color: #1d1d1f;
                box-shadow: none;
                position: relative;
                transition: color 0.2s ease, opacity 0.2s ease;
                -webkit-tap-highlight-color: transparent;
            }

            .content-links__a ~ .content-links__a::before {
                content: '';
                display: block;
                width: min(3.25rem, 28vw);
                height: 1px;
                margin: 0 auto 0.08rem;
                background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.12), transparent);
            }

            .content-links__a:hover {
                text-decoration: none;
                color: #0066cc;
                background: transparent;
            }

            .content-links__a:focus-visible {
                text-decoration: none;
                color: #0066cc;
                background: rgba(0, 0, 0, 0.025);
                outline: 2px solid rgba(0, 102, 204, 0.3);
                outline-offset: 4px;
                border-radius: 4px;
            }

            .content-links__a:hover .content-links__title,
            .content-links__a:focus-visible .content-links__title {
                color: #0066cc;
            }

            .content-links__a:hover .content-links__desc,
            .content-links__a:focus-visible .content-links__desc {
                color: #6e6e73;
            }

            .content-links__a:active {
                opacity: 0.92;
            }

            .content-links__title {
                display: block;
                font-size: 1.0625rem;
                font-weight: 500;
                letter-spacing: 0.04em;
                line-height: 1.45;
                color: inherit;
            }

            .content-links__desc {
                display: block;
                margin-top: 0.28rem;
                font-size: 0.8125rem;
                font-weight: 400;
                letter-spacing: 0.02em;
                color: #8e8e93;
                line-height: 1.55;
                max-width: 19rem;
            }

            .content-links__desc:empty {
                display: none;
            }

            .page-shell {
                padding-left: 1rem;
                padding-right: 1rem;
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .initial-avatar {
                width: 150px;
                height: 150px;
            }

            .initial-name {
                font-size: 1.875rem;
            }

            .initial-title {
                font-size: 1.0625rem;
            }
        }

        @media (min-width: 640px) {
            #social-icons {
                gap: 1.25rem;
                overflow-x: visible;
            }

            #social-icons .social-icon {
                font-size: 1.75rem;
            }
        }

        @media (min-width: 768px) {
            #social-icons {
                gap: 1.5rem;
            }
        }

        @media (min-width: 1024px) {
            #social-icons .social-icon {
                font-size: 2rem;
            }
        }
        
        .card {
            transition: opacity 0.35s ease, transform 0.35s ease;
            opacity: 0;
            transform: translateY(12px);
        }
        
        .card.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 正文链接 */
        .content-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.35rem 0.2rem;
            width: 100%;
            max-width: 36rem;
            margin: 0.35rem auto 0;
            padding: 0.25rem 0;
            font-size: 1rem;
            line-height: 1.6;
        }

        .content-links__sep {
            color: #c7c7cc;
            user-select: none;
            padding: 0 0.15rem;
        }

        .content-links__title {
            display: inline;
        }

        .content-links__desc {
            display: none;
        }

        .content-links__a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
            padding: 0.2rem 0.15rem;
            border-radius: 4px;
            transition: color 0.15s ease, text-decoration-color 0.15s ease;
        }

        @media (min-width: 641px) {
            .content-links__a:hover {
                color: #004499;
                text-decoration: underline;
                text-underline-offset: 0.2em;
            }
        }

        .content-links__a:focus {
            outline: none;
        }

        @media (min-width: 641px) {
            .content-links__a:focus-visible {
                outline: 2px solid rgba(0, 102, 204, 0.45);
                outline-offset: 2px;
            }
        }

        .content-links .card {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .content-links .card.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 主栏：略收窄，段落更易读 */
        .page-shell {
            max-width: 52rem;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1.25rem;
            padding-right: 1.25rem;
        }
        
        @media (min-width: 640px) {
            .page-shell {
                padding-left: 2rem;
                padding-right: 2rem;
            }
        }
        
        /* 区块之间只用间距拉节奏，避免多条横线切碎版面 */
        .layout-stack {
            display: flex;
            flex-direction: column;
            gap: 3.25rem;
        }
        
        @media (min-width: 768px) {
            .layout-stack {
                gap: 4.5rem;
            }
        }

        /* 主栏一屏收尾：压缩纵向节奏；引言区不再吸底 */
        #main-content.layout-stack {
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
            gap: clamp(1rem, 3vh, 2.25rem);
        }

        @media (min-width: 768px) {
            #main-content.layout-stack {
                gap: clamp(1.25rem, 3.5vh, 2.75rem);
            }
        }

        #quote-section {
            width: 100%;
            max-width: 34rem;
            margin-left: auto;
            margin-right: auto;
            padding-top: 0.35rem;
            padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
        }

        @media (max-height: 720px) {
            #main-content.layout-stack {
                gap: 0.75rem;
            }

            .font-quote {
                font-size: clamp(1.0625rem, 2.1vw + 0.45rem, 1.3125rem);
            }

            .quote-attribution {
                margin-top: 0.65rem;
            }
        }

        .hero-title {
            font-size: clamp(2.125rem, 5.5vw, 3.25rem);
            line-height: 1.06;
            letter-spacing: -0.038em;
            overflow: visible;
        }
        
        .section-eyebrow {
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #86868b;
            text-align: center;
            margin: 0 0 1.125rem;
        }
        
        .section-label {
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #86868b;
            text-align: center;
            margin: 0 0 1.75rem;
        }
        
        .quote-container {
            position: relative;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.75s cubic-bezier(0.25, 0.1, 0.25, 1),
                transform 0.75s cubic-bezier(0.25, 0.1, 0.25, 1);
            margin-left: auto;
            margin-right: auto;
            padding: 0.35rem 0.5rem 0.5rem;
            text-align: center;
            perspective: 560px;
            -webkit-tap-highlight-color: transparent;
        }

        .quote-container:focus {
            outline: none;
        }

        .quote-container:focus-visible {

        /* 成对引号：挂在正文块左上角 / 右下角，不占单独一行 */
        #quote.font-quote {

            padding-right: 0.65em;

        #quote.font-quote::before,
        #quote.font-quote::after {

        .quote-container.show #quote.font-quote::after {

        #quote.font-quote::before {
            content: '\201C';
            left: 0;
            top: 0.02em;
        }

        #quote.font-quote::after {
            content: '\201D';
            right: 0;
            bottom: 0.08em;
        }

        #quote.font-quote .quote-glyph {
            position: relative;
            z-index: 1;

        .quote-glyph {

    <script>
        /** 境内 CN → 中文；境外 → 英文。失败时按浏览器语言回退。 */
        let siteLocale = 'zh';

        /** 格言列表（由 config.{zh|en}.json 的 quotes 填充） */
        let quotesFromConfig = [];

        /** 当前展示的格言在列表中的下标 */
        let quoteDisplayIndex = 0;

        /** 自动切换下一条格言的间隔（5.20 秒） */
        const QUOTE_AUTO_ROTATE_MS = 5200;

        /** 自动轮播计时器；手动点击后会 clear 再 schedule，重新从完整间隔计起 */
        let quoteAutoRotateTimerId = null;

        function scheduleQuoteAutoRotate() {
            clearTimeout(quoteAutoRotateTimerId);
            quoteAutoRotateTimerId = setTimeout(function () {
                updateQuote(true);
                scheduleQuoteAutoRotate();
            }, QUOTE_AUTO_ROTATE_MS);
        }

        /** 当前语言 ui 文案（来自 config.*.json，供 toast / title 等使用） */
        let siteUi = {};
        let siteAnalytics = null;
        var LIKE_STORAGE_KEY = 'homepage-liked-v1';
        var LIKE_TOTAL_LS_KEY = 'homepage-like-total-v1';
        var LIKE_VISITOR_LS_KEY = 'homepage-visitor-id-v1';
        var ABACUS_API_BASE = 'https://abacus.jasoncameron.dev';

        function uiMessage(key, replacements) {
            var template = siteUi && typeof siteUi[key] === 'string' ? siteUi[key] : '';
            if (!replacements) return template;
            return Object.keys(replacements).reduce(function (acc, k) {
                return acc.split('{' + k + '}').join(replacements[k]);
            }, template);
        }

        /** 配置文件加载失败时的空壳（不含个人文案，仅保证结构） */
        function createEmptySiteConfig(loc) {
            return {
                ui: {
                    htmlLang: loc === 'zh' ? 'zh-CN' : 'en',
                    pageTitle: '',
                    nameDisplay: '',
                    tagline: '',
                    avatarAlt: '',
                    socialNavAria: '',
                    linksSectionAria: '',
                    contentLinksNavAria: '',
                    quoteSectionAria: '',
                    quoteToggleAria: '',
                    quoteToggleTitle: '',
                    headerAvatarAria: '',
                    mailCopySuccess: '',
                    mailCopyManual: '',
                    wechatCopySuccess: '',
                    wechatCopyManual: '',
                    wechatTitleDesktop: '',
                    wechatTitleMobile: '',
                    qqTitle: ''
                },
                avatarMedia: { fullUrl: '', thumbUrl: '', thumbSize: 32, fallbackUrl: '' },
                avatarTap: { bubbles: [] },
                presence: null,
                social: [],
                contentLinks: [],
                quotes: { mottos: [], famous: [] },
                analytics: { likes: { enabled: false } }
            };
        }

        function getOrCreateVisitorId() {
            try {
                var id = localStorage.getItem(LIKE_VISITOR_LS_KEY);
                if (id) return id;
                id =
                    'v-' +
                    Date.now().toString(36) +
                    '-' +
                    Math.random().toString(36).slice(2, 10);
                localStorage.setItem(LIKE_VISITOR_LS_KEY, id);
                return id;
            } catch (e) {
                return 'v-anon';
            }
        }

        function readLocalLikeTotal(storageKey) {
            try {
                var raw = localStorage.getItem(storageKey || LIKE_TOTAL_LS_KEY);
                var n = parseInt(raw, 10);
                return isNaN(n) || n < 0 ? 0 : n;
            } catch (e) {
                return 0;
            }
        }

        function writeLocalLikeTotal(count, storageKey) {
            try {
                localStorage.setItem(storageKey || LIKE_TOTAL_LS_KEY, String(Math.max(0, count)));
            } catch (e) {}
        }

        function abacusGet(namespace, key) {
            var url =
                ABACUS_API_BASE +
                '/get/' +
                encodeURIComponent(namespace) +
                '/' +
                encodeURIComponent(key);
            return fetch(url, { cache: 'no-store' })
                .then(function (res) {
                    if (res.status === 404) return { __missing: true };
                    if (!res.ok) return null;
                    return res.json();
                })
                .then(function (data) {
                    if (data && data.__missing) return null;
                    return data && typeof data.value === 'number' ? data.value : null;
                })
                .catch(function () {
                    return null;
                });
        }

        function abacusHit(namespace, key) {
            var url =
                ABACUS_API_BASE +
                '/hit/' +
                encodeURIComponent(namespace) +
                '/' +
                encodeURIComponent(key);
            return fetch(url, { cache: 'no-store' })
                .then(function (res) {
                    if (!res.ok) return null;
                    return res.json();
                })
                .then(function (data) {
                    return data && typeof data.value === 'number' ? data.value : null;
                })
                .catch(function () {
                    return null;
                });
        }

        function abacusGetWithRetry(namespace, key, retriesLeft, missingOk) {
            return abacusGet(namespace, key).then(function (val) {
                if (val !== null) return val;
                if (missingOk) return null;
                if (retriesLeft <= 0) return null;
                return new Promise(function (resolve) {
                    window.setTimeout(resolve, 450);
                }).then(function () {
                    return abacusGetWithRetry(namespace, key, retriesLeft - 1, false);
                });
            });
        }

        function abacusHitWithRetry(namespace, key, retriesLeft) {
            return abacusHit(namespace, key).then(function (val) {
                if (val !== null) return val;
                if (retriesLeft <= 0) return null;
                return new Promise(function (resolve) {
                    window.setTimeout(resolve, 450);
                }).then(function () {
                    return abacusHitWithRetry(namespace, key, retriesLeft - 1);
                });
            });
        }

        function resolveLikeProvider(likesCfg) {
            var p = likesCfg && typeof likesCfg.provider === 'string' ? likesCfg.provider.toLowerCase() : '';
            if (p === 'local') return 'local';
            if (p === 'abacus' || p === 'remote') return 'abacus';
            if (p === 'countapi') return 'abacus';
            return 'abacus';
        }

        function likeAbacusKeys(likesCfg, visitorId) {
            var ns =
                (likesCfg && likesCfg.abacusNamespace) ||
                (likesCfg && likesCfg.countApiNamespace) ||
                'abcreatoris.com';
            var prefix =
                likesCfg && typeof likesCfg.likedVisitorKeyPrefix === 'string'
                    ? likesCfg.likedVisitorKeyPrefix
                    : 'liked-';
            var totalKey = (likesCfg && likesCfg.totalLikesKey) || 'total-likes';
            return {
                ns: ns,
                visitorKey: prefix + visitorId,
                totalKey: totalKey
            };
        }

        function fetchLikeTotal(likesCfg) {
            var provider = resolveLikeProvider(likesCfg);
            var localKey =
                likesCfg && typeof likesCfg.localTotalKey === 'string'
                    ? likesCfg.localTotalKey
                    : LIKE_TOTAL_LS_KEY;
            if (provider === 'local') {
                return Promise.resolve(readLocalLikeTotal(localKey));
            }
            var keys = likeAbacusKeys(likesCfg, '');
            return abacusGetWithRetry(keys.ns, keys.totalKey, 2).then(function (val) {
                if (typeof val === 'number' && val >= 0) {
                    writeLocalLikeTotal(val, localKey);
                    return val;
                }
                return null;
            });
        }

        function fetchVisitorLikedOnServer(likesCfg, visitorId) {
            var keys = likeAbacusKeys(likesCfg, visitorId);
            var likedKey = LIKE_STORAGE_KEY + '-' + visitorId;
            try {
                if (
                    localStorage.getItem(LIKE_STORAGE_KEY) !== '1' &&
                    localStorage.getItem(likedKey) !== '1'
                ) {
                    return Promise.resolve(false);
                }
            } catch (e) {}
            return abacusGetWithRetry(keys.ns, keys.visitorKey, 0, true).then(function (val) {
                return typeof val === 'number' && val >= 1;
            });
        }

        /** 首次点赞：登记访客 + 全局总数 +1；已登记则只拉取总数 */
        function registerLikeOnServer(likesCfg, visitorId) {
            var provider = resolveLikeProvider(likesCfg);
            var localKey =
                likesCfg && typeof likesCfg.localTotalKey === 'string'
                    ? likesCfg.localTotalKey

                var ed = typeof h.endDay === 'number' ? h.endDay : sd;

        /** 按头像实际尺寸更新角标锚点（与 w-40 及过渡动画终点一致） */
        function syncAvatarBadgeGeometry() {
            var slot = document.querySelector('.header-avatar-slot');
            if (!slot) return;
            var size = slot.offsetWidth;
            if (!size) return;
            var rPx = size / 2;
            slot.style.setProperty('--avatar-r', rPx + 'px');
            var badgeRem = Math.max(2.15, Math.min(2.55, size / 16 * 0.26)).toFixed(3) + 'rem';
            slot.style.setProperty('--avatar-badge-hit', badgeRem);
        }

        function getHeaderAvatarSlotRect() {
            var slot = document.querySelector('.header-avatar-slot');
            if (!slot) return null;
            syncAvatarBadgeGeometry();
            return slot.getBoundingClientRect();
        }

        function revealPresenceBadge() {
            syncAvatarBadgeGeometry();
            var el = document.getElementById('avatar-presence-badge');
            if (!el || el.hasAttribute('hidden')) return;
            el.classList.remove('is-revealed');
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    el.classList.add('is-revealed');
                });
            });
        }

        function playAvatarPreBadgeWiggle(done) {
            var slot = document.querySelector('.header-avatar-slot');
            if (!slot || prefersReducedMotion()) {
                if (done) done();
                return;
            }
            slot.classList.remove('avatar-wiggle-pre-badge');
            void slot.offsetWidth;
            slot.classList.add('avatar-wiggle-pre-badge');
            slot.addEventListener(
                'animationend',
                function onEnd() {
                    slot.removeEventListener('animationend', onEnd);
                    slot.classList.remove('avatar-wiggle-pre-badge');
                    if (done) done();
                },
                { once: true }
            );
        }

        function onMainIntroAnimationsComplete() {
            if (mainIntroAnimComplete) return;
            mainIntroAnimComplete = true;
            syncAvatarBadgeGeometry();
            renderPresenceBadge();
            playAvatarPreBadgeWiggle(function () {
                revealPresenceBadge();
                var wrap = document.getElementById('header-avatar-wrap');
                if (!wrap) return;
                wrap.classList.add('avatar-wrap--ready');
                wrap.setAttribute('tabindex', '0');
                bindHeaderAvatarInteractions();
            });
        }

        function headerFlairBaseLetterSpacingEm() {
            var lang = document.documentElement.lang || '';
            return /^en/i.test(lang) ? 0.052 : 0.06;
        }

        /** 大屏 + 可悬停设备才用湍流/逐字动画（手机仅淡入） */
        function shouldUseHeaderFlairMotion() {
            if (prefersReducedMotion()) return false;
            return window.matchMedia('(min-width: 768px) and (hover: hover)').matches;
        }

        /** 每次点击随机垂直偏移，且与上一次拉开差距 */
        function pickHeaderFlairShiftRem() {
            var wide = shouldUseHeaderFlairMotion();
            var min = wide ? -4 : -2.25;
            var max = wide ? 4 : 2.25;
            var step = 0.25;
            var shift = 0;
            var attempts = 0;
            do {
                shift = min + Math.random() * (max - min);
                shift = Math.round(shift / step) * step;
                attempts += 1;
            } while (
                lastHeaderFlairShiftRem !== null &&
                Math.abs(shift - lastHeaderFlairShiftRem) < 1.1 &&
                attempts < 14
            );
            lastHeaderFlairShiftRem = shift;
            return shift.toFixed(2);
        }

        function headerFlairShiftTransform(line, scale, outwardPx) {
            var shift = line.style.getPropertyValue('--flair-shift') || '0rem';
            var x =
                typeof outwardPx === 'number' && Math.abs(outwardPx) > 0.01
                    ? ' translateX(' + outwardPx.toFixed(1) + 'px)'
                    : '';
            return 'translateY(' + shift.trim() + ') scale(' + scale + ')' + x;
        }

        function headerFlairSide(host) {
            if (!host) return 'right';
            if (host.classList.contains('header-flair--left') || host.id === 'header-flair-left') {
                return 'left';
            }
            return 'right';
        }

        function headerFlairOutwardSign(side) {
            return side === 'left' ? 1 : -1;
        }

        function cancelHeaderFlairDistort() {
            if (headerFlairDistortRaf) {
                cancelAnimationFrame(headerFlairDistortRaf);
                headerFlairDistortRaf = null;
            }
        }

        function getHeaderFlairDistortNodes() {
            return {
                turbulence: document.getElementById('header-flair-turbulence'),
                displacement: document.getElementById('header-flair-displacement')
            };
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function setHeaderFlairCharVars(span, side, idx, total) {
            var twist = (Math.random() * 14 - 7).toFixed(1);
            var lift = (Math.random() * 0.2 + 0.28).toFixed(2);
            var centerWeight =
                side === 'left' ? (idx + 0.5) / Math.max(1, total) : (total - idx - 0.5) / Math.max(1, total);
            var fromXEm = centerWeight * HEADER_FLAIR_DISTORT.charFromXEm;
            var fromX = side === 'left' ? fromXEm : -fromXEm;
            span.style.setProperty('--twist-r', twist + 'deg');
            span.style.setProperty('--lift', lift + 'em');
            span.style.setProperty('--from-x', fromX.toFixed(2) + 'em');
        }

        function fillHeaderFlairChars(line, text, side) {
            line.textContent = '';
            var idx = 0;
            var segments = segmentQuoteGlyphs(text);
            var animateTotal = segments.reduce(function (acc, seg) {
                return acc + (seg.animate ? 1 : 0);
            }, 0);
            segments.forEach(function (seg) {
                if (!seg.animate) {
                    line.appendChild(document.createTextNode(seg.text));
                    return;
                }
                var span = document.createElement('span');
                span.className = 'header-flair-char';
                span.textContent = seg.text;
                setHeaderFlairCharVars(span, side, idx, animateTotal);
                span.style.setProperty('--fi', String(idx));
                idx += 1;
                line.appendChild(span);
            });
            return idx;
        }

        /** 整句 SVG 湍流（由中心向外扩散 + 模糊消退）+ 逐字向外归位 */
        function runHeaderFlairDistortIn(line, host, done) {
            var nodes = getHeaderFlairDistortNodes();
            var cfg = HEADER_FLAIR_DISTORT;
            var baseSpacing = headerFlairBaseLetterSpacingEm();
            var side = headerFlairSide(host);
            var outwardSign = headerFlairOutwardSign(side);

            cancelHeaderFlairDistort();

            if (!nodes.turbulence || !nodes.displacement || !shouldUseHeaderFlairMotion()) {
                line.classList.remove('is-distorting', 'is-out');
                line.classList.add('is-sharp', 'is-live');
                line.style.filter = '';
                line.style.opacity = '1';
                line.style.transform = headerFlairShiftTransform(line, 1, 0);
                line.style.letterSpacing = baseSpacing + 'em';
                if (done) done();
                return;
            }

            var turbSeed = 2 + Math.floor(Math.random() * 16);
            nodes.turbulence.setAttribute('seed', String(turbSeed));
            line.classList.remove('is-sharp', 'is-out');
            line.classList.add('is-distorting');

            requestAnimationFrame(function () {
                line.classList.add('is-live');
            });

            line.style.letterSpacing = baseSpacing + cfg.extraSpacing + 'em';

            var start = performance.now();

            function frame(now) {
                var raw = Math.min((now - start) / cfg.duration, 1);
                var progress = easeOutCubic(raw);
                var turbulence = 1 - progress;
                var spread = 1 - progress;

                var blurPhase = Math.min(1, progress / cfg.blurFadePortion);
                var blurAmount = cfg.maxBlur * (1 - easeOutCubic(blurPhase));

                nodes.displacement.setAttribute('scale', String(cfg.maxScale * turbulence));
                nodes.turbulence.setAttribute(
                    'baseFrequency',
                    cfg.baseFreqX + 0.04 * turbulence + ' ' + (cfg.baseFreqY + 0.08 * turbulence)
                );
                nodes.turbulence.setAttribute('seed', String(turbSeed + Math.floor(progress * 22)));

                if (blurAmount > 0.08) {
                    line.style.filter =
                        'url(#header-flair-distort-filter) blur(' + blurAmount.toFixed(2) + 'px)';
                } else {
                    line.style.filter = 'url(#header-flair-distort-filter)';
                }

                var outwardPx = outwardSign * cfg.maxOutwardPx * spread;
                line.style.opacity = String(0.55 + progress * 0.45);
                line.style.transform = headerFlairShiftTransform(line, 1 + 0.03 * turbulence, outwardPx);
                line.style.letterSpacing = baseSpacing + cfg.extraSpacing * turbulence + 'em';

                if (raw < 1) {
                    headerFlairDistortRaf = requestAnimationFrame(frame);
                    return;
                }

                headerFlairDistortRaf = null;
                line.classList.remove('is-distorting');
                line.classList.add('is-sharp');
                line.style.filter = 'none';
                line.style.opacity = '1';
                line.style.transform = headerFlairShiftTransform(line, 1, 0);
                line.style.letterSpacing = baseSpacing + 'em';
                if (done) done();
            }

            headerFlairDistortRaf = requestAnimationFrame(frame);
        }

        function hideHeaderFlairLine(line, host) {
            cancelHeaderFlairDistort();
            line.style.filter = 'none';
            line.classList.remove('is-distorting', 'is-sharp', 'is-live');
            line.classList.add('is-out');
            window.setTimeout(function () {
                if (host.contains(line)) host.removeChild(line);
            }, 440);
        }

        function showHeaderFlairSimple(line) {
            var baseSpacing = headerFlairBaseLetterSpacingEm();
            line.classList.add('header-flair-line--simple', 'is-sharp');
            line.style.filter = 'none';
            line.style.letterSpacing = baseSpacing + 'em';
            line.style.transform = headerFlairShiftTransform(line, 1, 0);
            line.style.opacity = '0';
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    line.classList.add('is-visible');
                });
            });
        }

        /** 每次点击随机左/右浮现一句（文案来自 config） */
        function playAvatarFlair() {
            var list = siteAvatarTap.bubbles;
            if (!list.length) return;

            var leftHost = document.getElementById('header-flair-left');
            var rightHost = document.getElementById('header-flair-right');
            if (!leftHost || !rightHost) return;

            var phrase = list[avatarTapPhraseIndex % list.length];
            avatarTapPhraseIndex += 1;

            var host = Math.random() < 0.5 ? leftHost : rightHost;
            var side = headerFlairSide(host);
            var useMotion = shouldUseHeaderFlairMotion();

            cancelHeaderFlairDistort();
            clearTimeout(avatarFlairHideTimer);
            leftHost.innerHTML = '';
            rightHost.innerHTML = '';

            var line = document.createElement('p');
            line.className = 'header-flair-line';
            line.style.setProperty('--flair-shift', pickHeaderFlairShiftRem() + 'rem');
            host.appendChild(line);

            var glyphCount = 0;
            if (useMotion) {
                glyphCount = fillHeaderFlairChars(line, phrase.text, side);
                runHeaderFlairDistortIn(line, host);
            } else {
                line.textContent = phrase.text;
                showHeaderFlairSimple(line);
            }

            var dwellMs;
            if (!useMotion) {
                dwellMs = 2600;
            } else if (prefersReducedMotion()) {
                dwellMs = 2800;
            } else {
                dwellMs = Math.max(3600, HEADER_FLAIR_DISTORT.duration + glyphCount * 42 + 900);
            }
            avatarFlairHideTimer = setTimeout(function () {
                hideHeaderFlairLine(line, host);
            }, dwellMs);
        }

        function bindHeaderAvatarInteractions() {
            var wrap = document.getElementById('header-avatar-wrap');
            if (!wrap || wrap.dataset.avatarTapBound) return;
            wrap.dataset.avatarTapBound = '1';
            wrap.addEventListener('click', function () {
                if (!mainIntroAnimComplete) return;
                playAvatarFlair();
            });
            wrap.addEventListener('keydown', function (e) {
                if (!mainIntroAnimComplete) return;
                if (e.key !== 'Enter' && e.key !== ' ') return;
                e.preventDefault();
                playAvatarFlair();
            });
        }

        /**
         * 与当前页面所在「目录」解析 config.zh.json / config.en.json 等。
         * 避免 GitHub Pages 类地址为 …/repo（无尾斜杠）时相对路径落到站点根目录 404。
         */
        function resolveAssetUrl(filename) {
            const baseEl = document.querySelector('base[href]');
            if (baseEl && baseEl.href) {
                return new URL(filename, baseEl.href).href;
            }
            let path = window.location.pathname || '/';
            if (!path.endsWith('/')) {
                const last = path.split('/').pop() || '';
                if (/\.[a-z0-9]+$/i.test(last)) {
                    path = path.replace(/\/[^/]+$/, '/');
                } else {
                    path = path + '/';
                }
            }
            return new URL(filename, window.location.origin + path).href;
        }

        function localeFromNavigator() {
            const nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
            return /^zh/i.test(nav) ? 'zh' : 'en';
        }

        async function resolveSiteLocale() {
            const ctrl = new AbortController();
            const tid = setTimeout(function () {
                ctrl.abort();
            }, 2800);
            try {
                const res = await fetch('https://get.geojs.io/v1/ip/country.json', {
                    signal: ctrl.signal,
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error('geo http');
                const geo = await res.json();
                const code = String(geo.country || geo.country_code || '').toUpperCase();
                if (code === 'CN') return 'zh';
                return 'en';
            } catch (e) {
                return localeFromNavigator();
            } finally {
                clearTimeout(tid);
            }
        }

        function isValidSiteConfig(data) {
            if (!data || typeof data !== 'object') return false;
            if (!data.ui || typeof data.ui !== 'object') return false;
            if (!Array.isArray(data.social) || data.social.length === 0) return false;
            if (!Array.isArray(data.contentLinks) || data.contentLinks.length === 0) return false;
            if (!quoteConfigHasItems(data.quotes)) return false;
            return true;
        }

        function applyUiFromObject(t) {
            document.documentElement.lang = t.htmlLang;
            document.title = t.pageTitle;

            document.querySelectorAll('.i18n-hero-name').forEach(function (el) {
                el.textContent = t.nameDisplay;
            });

            const tagInitial = document.getElementById('tagline-initial');
            const tagMain = document.getElementById('tagline-main');
            if (tagInitial) tagInitial.textContent = t.tagline;
            if (tagMain) tagMain.textContent = t.tagline;

            ['profile-avatar', 'transition-avatar', 'final-avatar'].forEach(function (id) {
                const el = document.getElementById(id);
                if (el) el.setAttribute('alt', t.avatarAlt);
            });

            const socialNav = document.getElementById('social-icons');
            if (socialNav) socialNav.setAttribute('aria-label', t.socialNavAria);

            const linksSection = document.getElementById('links-section');
            if (linksSection) linksSection.setAttribute('aria-label', t.linksSectionAria);

            const cardsNav = document.getElementById('cards-container');
            if (cardsNav) cardsNav.setAttribute('aria-label', t.contentLinksNavAria);

            const quoteSection = document.getElementById('quote-section');
            if (quoteSection) quoteSection.setAttribute('aria-label', t.quoteSectionAria);

            const quoteContainer = document.getElementById('quote-container');
            if (quoteContainer) {
                quoteContainer.setAttribute('aria-label', t.quoteToggleAria);
                quoteContainer.setAttribute('title', t.quoteToggleTitle);
            }

            var headerWrap = document.getElementById('header-avatar-wrap');
            if (headerWrap && typeof t.headerAvatarAria === 'string' && t.headerAvatarAria.length) {
                headerWrap.setAttribute('aria-label', t.headerAvatarAria);
            }
        }

        function filterQuotesList(list) {
            return (Array.isArray(list) ? list : []).filter(function (q) {
                return q && typeof q.text === 'string' && typeof q.author === 'string';
            });
        }

        function quoteConfigHasItems(quotes) {
            if (Array.isArray(quotes)) return quotes.length > 0;
            if (!quotes || typeof quotes !== 'object') return false;
            var m = Array.isArray(quotes.mottos) ? quotes.mottos.length : 0;
            var f = Array.isArray(quotes.famous) ? quotes.famous.length : 0;
            return m + f > 0;
        }

        function shuffleQuoteList(list) {
            var arr = list.slice();
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = arr[i];
                arr[i] = arr[j];
                arr[j] = tmp;
            }
            return arr;
        }

        /** 解析 config：座右铭 / 名人警句分组（兼容旧版 quotes 数组） */
        function parseQuotesFromConfig(quotes) {
            var mottos = [];
            var famous = [];

            if (Array.isArray(quotes)) {
                famous = filterQuotesList(quotes);
                return { mottos: mottos, famous: famous };
            }

            if (!quotes || typeof quotes !== 'object') {
                return { mottos: mottos, famous: famous };
            }

            var mottoAuthor =
                typeof quotes.mottosTitle === 'string' && quotes.mottosTitle.length
                    ? quotes.mottosTitle
                    : '我的座右铭';

            if (Array.isArray(quotes.mottos)) {
                quotes.mottos.forEach(function (m) {
                    if (!m || typeof m.text !== 'string' || !m.text.trim()) return;
                    mottos.push({
                        text: m.text.trim(),
                        author:
                            typeof m.author === 'string' && m.author.length ? m.author : mottoAuthor
                    });
                });
            }

            if (Array.isArray(quotes.famous)) {
                quotes.famous.forEach(function (q) {
                    if (!q || typeof q.text !== 'string' || typeof q.author !== 'string') return;
                    if (!q.text.trim() || !q.author.trim()) return;
                    famous.push({ text: q.text.trim(), author: q.author.trim() });
                });
            }

            return { mottos: mottos, famous: famous };
        }

        /** 每次访问：两组各自打乱后交替合并（座右铭 ↔ 名人警句） */
        function buildQuotePlayOrder(quotes) {
            var parsed = parseQuotesFromConfig(quotes);
            var mottos = shuffleQuoteList(parsed.mottos);
            var famous = shuffleQuoteList(parsed.famous);
            var out = [];
            var mi = 0;
            var fi = 0;

            if (mottos.length === 0) return famous;
            if (famous.length === 0) return mottos;

            var startWithMotto = Math.random() < 0.5;
            while (mi < mottos.length || fi < famous.length) {
                if (startWithMotto) {
                    if (mi < mottos.length) out.push(mottos[mi++]);
                    if (fi < famous.length) out.push(famous[fi++]);
                } else {
                    if (fi < famous.length) out.push(famous[fi++]);
                    if (mi < mottos.length) out.push(mottos[mi++]);
                }
            }

            return out;
        }

        function normalizeLinksFromConfig(data) {
            const social = Array.isArray(data.social) ? data.social : [];
            const contentLinks = Array.isArray(data.contentLinks) ? data.contentLinks : [];

            const socialNorm = social.filter(function (s) {
                if (!s || typeof s.label !== 'string' || !s.label.length) return false;
                if (s.iconKind === 'xiaohongshu') {
                    return typeof s.href === 'string' && s.href.length > 0;
                }
                if (s.iconKind === 'wechat') {
                    return (
                        typeof s.wechatId === 'string' &&
                        s.wechatId.trim().length > 0 &&
                        typeof s.iconClass === 'string' &&
                        s.iconClass.length > 0 &&
                        typeof s.href === 'string'
                    );
                }
                if (s.iconKind === 'qq') {
                    var uq = typeof s.qqUin === 'string' ? String(s.qqUin).replace(/\D/g, '') : '';
                    return (
                        uq.length >= 5 &&
                        uq.length <= 14 &&
                        typeof s.iconClass === 'string' &&
                        s.iconClass.length > 0 &&
                        typeof s.href === 'string'
                    );
                }
                if (typeof s.href !== 'string') return false;
                return typeof s.iconClass === 'string' && s.iconClass.length > 0;
            });

            const linksNorm = contentLinks.filter(function (c) {
                return c && typeof c.url === 'string' && typeof c.title === 'string' && c.title.length > 0;
            });

            if (socialNorm.length === 0 || linksNorm.length === 0) {
                throw new Error('links empty');
            }

            siteSocialLinks = socialNorm.map(function (s) {
                var ik =
                    s.iconKind === 'xiaohongshu'
                        ? 'xiaohongshu'
                        : s.iconKind === 'wechat'
                          ? 'wechat'
                          : s.iconKind === 'qq'
                            ? 'qq'
                            : '';
                return {
                    href: s.href,
                    label: s.label,
                    iconClass: typeof s.iconClass === 'string' ? s.iconClass : '',
                    iconKind: ik,
                    cssClass: typeof s.cssClass === 'string' ? s.cssClass : '',
                    wechatId: typeof s.wechatId === 'string' ? s.wechatId.trim() : '',
                    qqUin:
                        typeof s.qqUin === 'string' ? String(s.qqUin).replace(/\D/g, '') : ''
                };
            });

            siteContentLinks = linksNorm.map(function (c) {
                return {
                    title: c.title,
                    description: typeof c.description === 'string' ? c.description : '',
                    url: c.url
                };
            });
        }

        async function fetchSiteConfig(loc) {
            try {
                const res = await fetch(resolveAssetUrl('config.' + loc + '.json'), { cache: 'no-store' });
                if (!res.ok) return null;
                const data = await res.json();
                return isValidSiteConfig(data) ? data : null;
            } catch (e) {
                return null;
            }
        }

        async function loadSiteConfig() {
            var payload;
            var data = await fetchSiteConfig(siteLocale);
            if (!data) {
                var altLoc = siteLocale === 'zh' ? 'en' : 'zh';
                data = await fetchSiteConfig(altLoc);
                if (data) siteLocale = altLoc;
            }
            if (!data) {
                console.warn('[homepage] config.' + siteLocale + '.json unavailable; using empty shell.');
                data = createEmptySiteConfig(siteLocale);
            }
            payload = data;
            siteUi = data.ui || {};
            try {
                applyUiFromObject(data.ui);
                normalizeLinksFromConfig(data);
                quotesFromConfig = buildQuotePlayOrder(data.quotes);
                quoteDisplayIndex = 0;
            } catch (e) {
                console.warn('[homepage] config links invalid:', e);
                siteSocialLinks = [];
                siteContentLinks = [];
                quotesFromConfig = [];
            }
            ingestAvatarExtensions(payload);
            applyAvatarUrlsToStacks();
            initSiteAnalytics(payload);
        }

        function getQuoteList() {
            return quotesFromConfig;
        }

        
        // 判断是否英文
        function isEnglish(text) {
            return /^[A-Za-z0-9\s.,'"!?;:()\-]+$/.test(text);
        }

        function prefersReducedMotion() {
            return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        /** 含中日韩则按字拆分，否则按英文词（空白保留为不动画文本节点） */
        function segmentQuoteGlyphs(text) {
            const hasCjk = /[\u3040-\u30ff\u3400-\u9fff\uf900-\ufaff]/.test(text);
            const segments = [];
            if (hasCjk) {
                for (const ch of text) {
                    segments.push({ text: ch, animate: !/\s/.test(ch) });
                }
            } else {
                text.split(/(\s+)/).forEach(function (part) {
                    if (!part) return;
                    if (/^\s+$/.test(part)) segments.push({ text: part, animate: false });
                    else segments.push({ text: part, animate: true });
                });
            }
            return segments;
        }

        function fillQuoteGlyphs(quoteElem, text) {
            quoteElem.textContent = '';
            let idx = 0;
            segmentQuoteGlyphs(text).forEach(function (seg) {
                if (!seg.animate) {
                    quoteElem.appendChild(document.createTextNode(seg.text));
                    return;
                }
                const span = document.createElement('span');
                span.className = 'quote-glyph';
                span.textContent = seg.text;
                span.style.setProperty('--qi', String(idx));
                idx += 1;
                quoteElem.appendChild(span);
            });
            return idx;
        }
        
        /**
         * 更新格言显示（逐词/逐字动画 + 署名错峰）。
         * @param {boolean} advanceNext 为 true 时先切到下一条（顺序循环），再渲染；首次展示请传 false。
         */
        function updateQuote(advanceNext) {
            const list = getQuoteList();
            if (list.length === 0) return;

            if (advanceNext === true) {
                quoteDisplayIndex = (quoteDisplayIndex + 1) % list.length;
            }

            const quote = list[quoteDisplayIndex];

            const container = document.getElementById('quote-container');
            const quoteElem = document.getElementById('quote');
            const authorEl = document.getElementById('quote-author');

            if (prefersReducedMotion()) {
                container.classList.remove('quote-play');
                quoteElem.textContent = quote.text;
                if (isEnglish(quote.text)) quoteElem.setAttribute('lang', 'en');
                else quoteElem.removeAttribute('lang');
                authorEl.textContent = '\u2014 ' + quote.author;
                authorEl.classList.toggle('quote-attribution-cn', /[\u4e00-\u9fff]/.test(quote.author));
                return;
            }

            container.classList.remove('quote-play');
            void container.offsetWidth;

            if (isEnglish(quote.text)) quoteElem.setAttribute('lang', 'en');
            else quoteElem.removeAttribute('lang');

            const glyphCount = fillQuoteGlyphs(quoteElem, quote.text);
            authorEl.textContent = '\u2014 ' + quote.author;
            authorEl.classList.toggle('quote-attribution-cn', /[\u4e00-\u9fff]/.test(quote.author));

            let authorDelaySec = 0.22 + glyphCount * 0.036;
            container.style.setProperty('--quote-author-delay', authorDelaySec + 's');

            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    container.classList.add('quote-play');
                });
            });
        }
        
        function showMailToast(message) {
            var el = document.getElementById('mail-toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'mail-toast';
                el.setAttribute('role', 'status');
                el.setAttribute('aria-live', 'polite');
                document.body.appendChild(el);
            }
            el.textContent = message;
            el.classList.add('mail-toast--visible');
            clearTimeout(showMailToast._hideTimer);
            showMailToast._hideTimer = setTimeout(function () {
                el.classList.remove('mail-toast--visible');
            }, 3200);
        }

        function copyTextToClipboard(text) {
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                return navigator.clipboard.writeText(text);
            }
            return new Promise(function (resolve, reject) {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    ta.setSelectionRange(0, text.length);
                    var ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    ok ? resolve() : reject(new Error('execCommand'));
                } catch (err) {
                    reject(err);
                }
            });
        }

        /** 先复制地址再打开 mailto：桌面端无客户端时仍可粘贴到网页邮箱 */
        function bindMailtoClick(anchor, mailtoHref) {
            if (!anchor || typeof mailtoHref !== 'string' || !/^mailto:/i.test(mailtoHref)) return;
            var addr = mailtoHref.replace(/^mailto:/i, '').split('?')[0];
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                copyTextToClipboard(addr)
                    .then(function () {
                        showMailToast(uiMessage('mailCopySuccess'));
                    })
                    .catch(function () {
                        showMailToast(uiMessage('mailCopyManual', { value: addr }));
                    })
                    .then(function () {
                        /* 稍晚再打开 mailto，让底部提示先出现、可读 */
                        window.setTimeout(function () {
                            window.location.href = mailtoHref;
                        }, 520);
                    });
            });
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            if (!container) return;
            container.innerHTML = '';

            siteContentLinks.forEach(function (item, index) {
                if (index > 0) {
                    const sep = document.createElement('span');
                    sep.className = 'content-links__sep';
                    sep.setAttribute('aria-hidden', 'true');
                    sep.textContent = '\u00b7';
                    container.appendChild(sep);
                }

                const a = document.createElement('a');
                a.href = item.url;
                a.className = 'card content-links__a';
                const titleSpan = document.createElement('span');
                titleSpan.className = 'content-links__title';
                titleSpan.textContent = item.title;
                a.appendChild(titleSpan);
                if (typeof item.description === 'string' && item.description.length > 0) {
                    a.setAttribute('aria-label', item.title + '：' + item.description);
                    a.title = item.description;
                    const descSpan = document.createElement('span');
                    descSpan.className = 'content-links__desc';
                    descSpan.textContent = item.description;
                    descSpan.setAttribute('aria-hidden', 'true');
                    a.appendChild(descSpan);
                }
                if (/^mailto:/i.test(item.url)) {
                    var mailAddr = item.url.replace(/^mailto:/i, '').split('?')[0];
                    a.title = a.title ? mailAddr + ' — ' + a.title : mailAddr;
                    bindMailtoClick(a, item.url);
                }
                if (/^https?:\/\//i.test(item.url)) {
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                }

                container.appendChild(a);

                setTimeout(function () {
                    a.classList.add('show');
                }, 800 + index * 70);
            });
        }
        
        
        // 动画序列
        function startAnimationSequence() {
            // 获取相关元素
            const initialLayout = document.getElementById('initial-layout');
            const mainContent = document.getElementById('main-content');
            const avatarTransition = document.getElementById('avatar-transition');
            const initialAvatar = document.querySelector('.initial-avatar');
            
            // 获取初始头像位置和大小
            const initialAvatarRect = initialAvatar.getBoundingClientRect();
            
            // 设置过渡头像的初始位置和大小
            avatarTransition.style.width = initialAvatarRect.width + 'px';
            avatarTransition.style.height = initialAvatarRect.height + 'px';
            avatarTransition.style.left = initialAvatarRect.left + 'px';
            avatarTransition.style.top = initialAvatarRect.top + 'px';
            avatarTransition.classList.remove('hidden');
            
            // 1. 初始布局淡出
            setTimeout(() => {
                initialLayout.classList.add('minimized');
                
                // 2. 头像动画过渡到最终位置（按 header 槽位实时测量，避免移动端写死 160px 错位）
                setTimeout(() => {
                    const finalSlotRect = getHeaderAvatarSlotRect();
                    if (!finalSlotRect) return;
                    avatarTransition.style.width = finalSlotRect.width + 'px';
                    avatarTransition.style.height = finalSlotRect.height + 'px';
                    avatarTransition.style.left = finalSlotRect.left + 'px';
                    avatarTransition.style.top = finalSlotRect.top + 'px';
                    
                    // 3. 显示主内容区域
                    setTimeout(() => {
                        mainContent.classList.add('show');
                        
                        // 4. 隐藏过渡头像并显示最终头像
                        setTimeout(() => {
                            avatarTransition.classList.add('hidden');
                            syncAvatarBadgeGeometry();

                            // 5. 先显示社交图标
                            setTimeout(() => {
                                const socialIcons = document.querySelectorAll('.social-icon');
                                socialIcons.forEach((icon, index) => {
                                    setTimeout(() => {
                                        icon.classList.add('show');
                                    }, index * 200);
                                });

                                // 6. 正文文字链接 → 引言
                                const cardsReveal = Math.max(420, socialIcons.length * 200 + 200);
                                setTimeout(function () {
                                    renderCards();
                                }, cardsReveal);

                                const quoteDelay = Math.max(620, socialIcons.length * 200 + 520);
                                setTimeout(() => {
                                    updateQuote(false);
                                    document.getElementById('quote-container').classList.add('show');
                                    setTimeout(onMainIntroAnimationsComplete, 900);
                                }, quoteDelay);
                            }, 500);
                        }, 800);
                    }, 800);
                }, 800);
            }, 1500);
        }
        
        document.addEventListener('DOMContentLoaded', async function () {
            siteLocale = await resolveSiteLocale();
            await loadSiteConfig();
            quoteDisplayIndex = 0;
            renderSocialIcons();

            startAnimationSequence();

            const quoteContainer = document.getElementById('quote-container');
            quoteContainer.addEventListener('click', function () {
                updateQuote(true);
                scheduleQuoteAutoRotate();
            });
            quoteContainer.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    updateQuote(true);
                    scheduleQuoteAutoRotate();
                }
            });
            scheduleQuoteAutoRotate();

            var badgeGeomResizeTimer;
            window.addEventListener('resize', function () {
                clearTimeout(badgeGeomResizeTimer);
                badgeGeomResizeTimer = setTimeout(function () {
                    syncAvatarBadgeGeometry();
                    if (mainIntroAnimComplete) renderPresenceBadge();
                }, 120);
            });
        });

        /** 触控 / 窄屏：社交里的微信、QQ用自定义协议唤起 App */
        function shouldUseMobileContactScheme() {
            if (window.matchMedia('(pointer: coarse)').matches) return true;
            if (
                window.matchMedia('(max-width: 767.98px)').matches &&
                ((navigator.maxTouchPoints && navigator.maxTouchPoints > 0) || 'ontouchstart' in window)
            ) {
                return true;
            }
            return false;
        }

        function renderSocialIcons() {
            const container = document.getElementById('social-icons');
            container.innerHTML = '';
            siteSocialLinks.forEach(function (link) {
                const a = document.createElement('a');
                const cssExtra = link.cssClass ? link.cssClass : '';
                a.className = 'social-icon' + (cssExtra ? ' ' + cssExtra : '');
                a.setAttribute('aria-label', link.label);

                var useMobileScheme = shouldUseMobileContactScheme();

                if (link.iconKind === 'wechat' && link.wechatId) {
                    if (useMobileScheme) {
                        a.href = 'weixin://dl/business/?t=' + encodeURIComponent(link.wechatId);
                        a.title = uiMessage('wechatTitleMobile', { value: link.wechatId });
                    } else {
                        a.href = '#';
                        a.title = uiMessage('wechatTitleDesktop', { value: link.wechatId });
                        a.addEventListener('click', function (e) {
                            e.preventDefault();
                            copyTextToClipboard(link.wechatId)
                                .then(function () {
                                    showMailToast(uiMessage('wechatCopySuccess'));
                                })
                                .catch(function () {
                                    showMailToast(uiMessage('wechatCopyManual', { value: link.wechatId }));
                                });
                        });
                    }
                } else if (link.iconKind === 'qq' && link.qqUin) {
                    var uin = link.qqUin;
                    if (useMobileScheme) {
                        a.href =
                            'mqqwpa://im/chat?chat_type=wpa&uin=' +
                            uin +
                            '&version=1&src_type=web&web_src=abcreatoris.com';
                        a.title = uiMessage('qqTitle', { value: uin });
                    } else {
                        a.href = 'https://wpa.qq.com/msgrd?v=3&uin=' + uin + '&site=qq&menu=yes';
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.title = uiMessage('qqTitle', { value: uin });
                    }
                } else {
                    a.href = link.href;
                    if (/^https?:\/\//i.test(link.href)) {
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                    }
                    if (/^mailto:/i.test(link.href)) {
                        a.title = link.href.replace(/^mailto:/i, '').split('?')[0];
                        bindMailtoClick(a, link.href);
                    }
                }

                if (link.iconKind === 'xiaohongshu') {
                    a.innerHTML = SOCIAL_SVG_XHS;
                } else {
                    const i = document.createElement('i');
                    i.className = link.iconClass;
                    i.setAttribute('aria-hidden', 'true');
                    a.appendChild(i);
                }
                container.appendChild(a);
            });
        }
    </script>
